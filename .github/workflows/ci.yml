name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Download orekit-data
        run: |
          curl -L -o orekit-data.zip https://gitlab.orekit.org/orekit/orekit-data/-/archive/main/orekit-data-main.zip
          unzip -q orekit-data.zip
          mv orekit-data-main orekit-data
      - name: Build and test with Maven
        run: ./mvnw -B verify