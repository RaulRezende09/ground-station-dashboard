name: Refresh TLE mirror

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch TLEs from Celestrak
        run: |
          mkdir -p data
          > data/tle-mirror.txt
          for id in 25544 25338 28654 33591 40024; do
            curl -s "https://celestrak.org/NORAD/elements/gp.php?CATNR=$id&FORMAT=tle" \
              -H "User-Agent: ground-station-dashboard-mirror/1.0 (github.com/RaulRezende09/ground-station-dashboard)" \
              >> data/tle-mirror.txt
          done

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tle-mirror.txt
          git diff --staged --quiet || git commit -m "chore: refresh TLE mirror"
          git push